<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 60">
  <rect x="1" y="1" width="70" height="58" rx="5" fill="#f4f4f2" stroke="#475569" stroke-width="2"/>

  <!-- Coil (A1A2) -->
  <rect x="10" y="14" width="22" height="16" rx="2" fill="#e2e8f0" stroke="#64748b" stroke-width="1.4"/>
  <path d="M14 18c2 3 4-3 6 0s4-3 6 0s4-3 6 0" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round"/>
  <text x="21" y="39" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#475569">A1A2</text>

  <!-- Divider -->
  <path d="M40 10v40" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="2 2"/>

  <!-- NO contact (COMNO) -->
  <circle cx="48" cy="22" r="2.2" fill="#f8fafc" stroke="#334155" stroke-width="1.3"/>
  <path d="M50.2 22H58" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M58 22L66 16" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="66" cy="16" r="2.2" fill="#f8fafc" stroke="#334155" stroke-width="1.3"/>
  <text x="57" y="39" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#475569">COM NO</text>

  <!-- Actuator link from coil to contact -->
  <path d="M32 22H46" stroke="#64748b" stroke-width="1.2" stroke-dasharray="1.5 1.5"/>

  <!-- Terminal stubs: N1/N2 top (coil), S1/S2 bottom (contact) -->
  <path d="M22 0v9M50 0v9M22 51v9M50 51v9" stroke="#334155" stroke-width="2"/>
  <g fill="#f8fafc" stroke="#334155">
    <circle cx="22" cy="0" r="2"/>
    <circle cx="50" cy="0" r="2"/>
    <circle cx="22" cy="60" r="2"/>
    <circle cx="50" cy="60" r="2"/>
  </g>
</svg>
