kind: PlaceType
type: Box
extends: housewire.default.Container
abstract: true
icon: box
label: Box
label_es: Caja
description: >
  Abstract base for physical enclosures that expose ports. A box may contain
  elements only; it never nests another box or place. Conduits attach to its
  ports.
description_es: >
  Base abstracta de las cajas físicas que exponen bocas. Una caja solo puede
  contener elementos; nunca anida otra caja ni otro lugar. Los conductos se
  anclan en sus bocas.
