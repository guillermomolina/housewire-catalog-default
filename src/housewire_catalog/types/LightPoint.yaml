kind: PlaceType
type: LightPoint
icon: lightbulb
label: Light point / luminaire outlet
label_es: Punto de luz
description: 'Light point (ceiling/wall hole, lampholder, luminaire outlet). Not a DeviceBox:
  no socket/switch mechanism. Physical end of conduits (typical mouth B1-1 or N1). A Luminaire
  element (electrical layer) may be added later under elements.

  '
description_es: 'Punto de luz (hueco techo/pared, portalámparas, salida de luminaria). No
  es DeviceBox: sin mecanismo de enchufe/interruptor. Extremo físico de tubos (boca típica
  B1-1 o N1). Más adelante puede añadirse un elemento Luminaire (capa eléctrica) bajo elements.

  '
terminals: {}
defaults:
  subtype: CeilingHole
representations:
  physical:
    kind: dynamic
    main_color:
      default: white
      options:
        white: "#f8fafc"
        light_gray: "#d1d5db"
        gray: "#6b7280"
        black: "#27272a"
subtypes:
  CeilingHole:
    label: Ceiling hole
    label_es: Hueco de techo
    defaults:
      mount: Ceiling
  WallHole:
    label: Wall hole
    label_es: Hueco de pared
    defaults:
      mount: Wall
  Emergency:
    label: Emergency luminaire outlet
    label_es: Salida de luminaria de emergencia
