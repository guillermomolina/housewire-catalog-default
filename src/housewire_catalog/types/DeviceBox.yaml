kind: PlaceType
type: DeviceBox
icon: box
label: Device / mechanism box
label_es: Caja de mecanismo
description: 'Mechanism box (socket, switch, …). Usually 1-gang; 2-gang / 3-gang group several
  devices in the same box. Declare mouths in openings (local ids N1, B1-1, …). Socket/Switch
  instances go under elements. Place type: no electrical terminals.

  '
description_es: 'Caja de mecanismo (enchufe, interruptor, …). Suele ser 1 módulo; 2/3 módulos
  agrupan varios dispositivos en la misma caja. Declara bocas en openings (ids locales N1,
  B1-1, …). Las instancias Socket/Switch van bajo elements. Tipo place: sin terminales eléctricos.

  '
terminals: {}
defaults:
  subtype: OneGang
  opening_grid:
    NS: 1
    WE: 1
    B: 1
representations:
  physical:
    kind: dynamic
    main_color:
      default: black
      options:
        white: "#f8fafc"
        gray: "#6b7280"
        black: "#27272a"
        blue: "#2563eb"
        orange: "#ea580c"
subtypes:
  OneGang:
    label: 1-gang
    label_es: 1 módulo
  TwoGang:
    label: 2-gang
    label_es: 2 módulos
  ThreeGang:
    label: 3-gang
    label_es: 3 módulos
