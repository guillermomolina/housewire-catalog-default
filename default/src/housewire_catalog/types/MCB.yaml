kind: DeviceType
type: MCB
extends: housewire.default.Device
icon: zap
label: Miniature circuit breaker
label_es: Magnetotérmico
description: >
  Miniature circuit breaker (MCB / PIA). Protects against overload and short
  circuit. Not an RCD (residual current device).
description_es: >
  Magnetotérmico (MCB / PIA). Protege frente a sobrecarga y cortocircuito.
  No es un diferencial (RCD).
# Face-cell ids: N1/S1 phase, N2/S2 neutral. label = casing mark.
terminal_grid:
  NS: 2
terminals:
  N1:
    label: "1"
    direction: In
    role: Phase
  S1:
    label: "2"
    direction: Out
    role: Phase
  N2:
    label: N
    direction: In
    role: Neutral
  S2:
    label: N
    direction: Out
    role: Neutral
representations:
  physical:
    kind: Fixed
    svg: symbols/mcb.svg
    size: [52, 68]
    show_label: false
    terminals:
      N1: {position: [0.25, 0.0]}
      N2: {position: [0.75, 0.0]}
      S1: {position: [0.25, 1.0]}
      S2: {position: [0.75, 1.0]}
