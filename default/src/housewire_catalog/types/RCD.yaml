kind: DeviceType
type: RCD
extends: housewire.default.Device
icon: shield-half
label: Residual current device
label_es: Diferencial
description: >
  Residual current device (RCD / RCCB). Protects against earth leakage.
  Not a miniature circuit breaker.
description_es: >
  Diferencial (RCD / RCCB). Protege frente a fugas a tierra. No es un
  magnetotérmico.
# Face-cell ids: N1/S1 phase, N2/S2 neutral.
terminal_grid:
  NS: 2
terminals:
  N1:
    label: ""
    direction: In
    role: Phase
  S1:
    label: ""
    direction: Out
    role: Phase
  N2:
    label: N
    direction: In
    role: Neutral
  S2:
    label: N
    direction: Out
    role: Neutral
representations:
  physical:
    kind: fixed
    svg: symbols/rcd.svg
    size: [56, 68]
    show_label: false
    terminals:
      N1: {position: [0.25, 0.0]}
      N2: {position: [0.75, 0.0]}
      S1: {position: [0.25, 1.0]}
      S2: {position: [0.75, 1.0]}
