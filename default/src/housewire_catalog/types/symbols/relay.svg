<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 60">
  <defs>
    <linearGradient id="relay-case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="relay-window" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <!-- Enclosure and terminal wells. -->
  <rect x="1" y="1" width="70" height="58" rx="6" fill="url(#relay-case)" stroke="#475569" stroke-width="2"/>
  <path d="M8 10h56M8 50h56" fill="none" stroke="#cbd5e1" stroke-width="1"/>
  <g fill="#cbd5e1" stroke="#64748b" stroke-width="1">
    <rect x="16" y="4" width="12" height="7" rx="2"/>
    <rect x="44" y="4" width="12" height="7" rx="2"/>
    <rect x="16" y="49" width="12" height="7" rx="2"/>
    <rect x="44" y="49" width="12" height="7" rx="2"/>
  </g>

  <!-- Coil and normally-open contact, shown through the front window. -->
  <rect x="8" y="14" width="56" height="32" rx="4" fill="url(#relay-window)" stroke="#0f172a" stroke-width="1.2"/>
  <path d="M13 30c0-6 3-6 3 0s3 6 3 0 3-6 3 0 3 6 3 0 3-6 3 0" fill="none" stroke="#60a5fa" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M31 30h7" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="2 2"/>
  <circle cx="42" cy="34" r="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <circle cx="58" cy="24" r="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <path d="M44 33l11-7" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
  <path d="M58 26v8H42" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="36" cy="40" r="1.4" fill="#22c55e"/>

  <!-- Compact terminal labels. -->
  <g fill="#475569" font-family="Arial, sans-serif" font-size="5" font-weight="700" text-anchor="middle">
    <text x="22" y="9">A1</text>
    <text x="50" y="9">A2</text>
    <text x="22" y="55">COM</text>
    <text x="50" y="55">NO</text>
  </g>

  <!-- Connection points match the catalog terminal coordinates. -->
  <path d="M22 0v4M50 0v4M22 56v4M50 56v4" fill="none" stroke="#334155" stroke-width="2"/>
  <g fill="#f8fafc" stroke="#334155" stroke-width="1">
    <circle cx="22" cy="0" r="2"/>
    <circle cx="50" cy="0" r="2"/>
    <circle cx="22" cy="60" r="2"/>
    <circle cx="50" cy="60" r="2"/>
  </g>
</svg>
