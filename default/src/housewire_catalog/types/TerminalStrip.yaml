kind: DeviceType
type: TerminalStrip
extends: housewire.default.Device
icon: grip-horizontal
label: Terminal strip
label_es: Regleta
description: >
  Terminal strip / splice block in a junction box.
  Face-cell ids only on N (N1..Nn); terminal_grid NS draws both sides of the
  same potential. Widen on the instance e.g. terminal_grid: { NS: 6 } and
  terminals N1..N6.
description_es: >
  Regleta / bloque de empalme en una caja. Ids de cara solo en N (N1..Nn);
  terminal_grid NS dibuja ambos lados del mismo potencial. Ampliar en la
  instancia p. ej. terminal_grid: { NS: 6 } y terminales N1..N6.
terminal_grid:
  NS: 3
terminals:
  N1:
    label: "1"
    direction: InOut
  N2:
    label: "2"
    direction: InOut
  N3:
    label: "3"
    direction: InOut
representations:
  physical:
    kind: modular
    module_svg: symbols/terminal-strip-pole.svg
    module_size: [20, 36]
    show_label: false
    main_color:
      default: white
      options:
        white: "#f8fafc"
        light_gray: "#d1d5db"
        dark_gray: "#6b7280"
        black: "#27272a"
        brown: "#92400e"
    module:
      terminals:
        N: {position: [0.5, 0.0]}
        S: {position: [0.5, 1.0]}
