kind: DeviceType
type: Switch
extends: housewire.default.Device
icon: toggle-right
label: Switch
label_es: Interruptor
description: 'Mechanism switch (light / load). Subtypes: unipolar (N1↔S1), crossover / 3-way
  (N1 common + N2/N3), intermediate (4-way).

  '
description_es: 'Interruptor de mecanismo (luz / carga). Subtipos: unipolar (N1↔S1), conmutador
  / 3 vías (N1 común + N2/N3), cruzamiento (4 vías).

  '
terminal_grid:
  NS: 1
terminals:
  N1:
    label: '1'
    direction: In
    role: Phase
  S1:
    label: '2'
    direction: Out
    role: Phase
defaults:
  subtype: Unipolar
representations:
  physical:
    kind: fixed
    svg: symbols/switch-unipolar.svg
    size: [64, 52]
    show_label: false
    main_color:
      default: white
      options:
        white: "#f8fafc"
        ivory: "#eee8d5"
        aluminum: "#a8adb4"
        light_gray: "#d1d5db"
        anthracite: "#45484d"
        black: "#27272a"
    terminals:
      N1: {position: [0.5, 0.0]}
      S1: {position: [0.5, 1.0]}
subtypes:
  Unipolar:
    label: Single-pole (1-way)
    label_es: Unipolar (1 vía)
  Crossover:
    label: 3-way
    label_es: Conmutador (3 vías)
    terminal_grid:
      NS: 3
    terminals:
      N1:
        label: C
        direction: InOut
        role: Phase
      N2:
        label: '1'
        direction: InOut
        role: Phase
      N3:
        label: '2'
        direction: InOut
        role: Phase
    representations:
      physical:
        kind: fixed
        svg: symbols/switch-crossover.svg
        size: [78, 52]
        show_label: false
        terminals:
          N1: {position: [0.25, 0.0]}
          N2: {position: [0.5, 0.0]}
          N3: {position: [0.75, 0.0]}
          S1: {position: [0.25, 1.0]}
          S2: {position: [0.5, 1.0]}
          S3: {position: [0.75, 1.0]}
  Intermediate:
    label: Intermediate / 4-way
    label_es: Cruzamiento (4 vías)
    terminal_grid:
      NS: 2
    terminals:
      N1:
        label: '1'
        direction: InOut
        role: Phase
      S1:
        label: '2'
        direction: InOut
        role: Phase
      N2:
        label: '3'
        direction: InOut
        role: Phase
      S2:
        label: '4'
        direction: InOut
        role: Phase
    representations:
      physical:
        kind: fixed
        svg: symbols/switch-intermediate.svg
        size: [72, 52]
        show_label: false
        terminals:
          N1: {position: [0.33, 0.0]}
          N2: {position: [0.67, 0.0]}
          S1: {position: [0.33, 1.0]}
          S2: {position: [0.67, 1.0]}
