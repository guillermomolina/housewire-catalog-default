kind: DeviceType
type: OpenTerminal
extends: housewire.default.Device
icon: open-terminal
label: Open terminal
label_es: Extremo libre
description: >
  Explicit placeholder for the known end of an otherwise unidentified or
  pending conductor. Conductors always connect to a real terminal, including
  while installation details are incomplete. Sole front pin is F1 (alias of
  the face-cell id F1-1 from terminal_grid F: 1).
description_es: >
  Marcador explícito para el extremo conocido de un conductor pendiente o
  todavía sin identificar. Los conductores siempre se conectan a un terminal
  real, incluso cuando faltan detalles de la instalación. El único pin frontal
  es F1 (alias del id de celda F1-1 del terminal_grid F: 1).
terminal_grid:
  F: 1
terminals:
  F1:
    label: "1"
    direction: InOut
representations:
  physical:
    kind: fixed
    svg: symbols/open-terminal.svg
    size: [30, 30]
    show_label: false
    terminals:
      F1: {position: [0.5, 0.5]}
    main_color:
      default: orange
      options:
        orange: "#f59e0b"
        yellow: "#eab308"
        red: "#ef4444"
        gray: "#6b7280"
