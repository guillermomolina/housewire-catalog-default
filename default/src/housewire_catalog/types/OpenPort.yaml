kind: PlaceType
type: OpenPort
extends: housewire.default.Enclosure
abstract: false
icon: open-port
label: Open port
label_es: Boca libre
description: >
  Explicit placeholder place for the known end of an otherwise unidentified or
  pending conduit. Conduits always connect to a real port, including while
  installation details are incomplete. Leaf place: no nested children or
  electrical devices. Exactly one port F1 (alias of face-cell F1-1) and
  exactly one conduit.
description_es: >
  Contenedor marcador para el extremo conocido de un tubo (conduit) pendiente o
  todavía sin identificar. Los tubos siempre se conectan a una boca real,
  incluso cuando faltan detalles de la instalación. Place hoja: sin hijos ni
  dispositivos eléctricos. Exactamente una boca F1 (alias de la celda F1-1) y
  exactamente un conduit.
contains: []
defaults:
  ports: [F1]
  port_grid:
    F: 1
representations:
  physical:
    kind: fixed
    svg: symbols/open-port.svg
    size: [36, 36]
    show_label: false
    main_color:
      default: orange
      options:
        orange: "#f59e0b"
        yellow: "#eab308"
        red: "#ef4444"
        gray: "#6b7280"
