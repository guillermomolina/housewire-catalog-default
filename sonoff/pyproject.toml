[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "housewire-catalog-sonoff"
version = "0.7.0"
description = "Sonoff device type catalog for HouseWire"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "SSPL-1.0" }
authors = [{ name = "Guillermo Adrián Molina" }]
keywords = ["housewire", "sonoff", "smart-home", "catalog"]
dependencies = [
    "PyYAML>=6.0",
    "housewire-catalog-default>=0.34.0",
]

[project.urls]
Homepage = "https://github.com/guillermomolina/housewire-catalog-sonoff"
Repository = "https://github.com/guillermomolina/housewire-catalog-sonoff"
Issues = "https://github.com/guillermomolina/housewire/issues"

[project.entry-points."housewire.catalog"]
"housewire.sonoff" = "housewire_catalog_sonoff:catalog_root"

[tool.hatch.build.targets.wheel]
packages = ["src/housewire_catalog_sonoff"]

[tool.hatch.build.targets.wheel.force-include]
"catalog.yaml" = "housewire_catalog_sonoff/catalog.yaml"
"types" = "housewire_catalog_sonoff/types"
