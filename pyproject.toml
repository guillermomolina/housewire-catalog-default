[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "housewire-catalog"
version = "0.18.0"
description = "Default type catalog for HouseWire (house/v2)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "SSPL-1.0" }
authors = [{ name = "Guillermo Adrián Molina" }]
keywords = ["housewire", "electrical", "catalog"]
dependencies = [
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/guillermomolina/housewire-catalog"
Repository = "https://github.com/guillermomolina/housewire-catalog"
Issues = "https://github.com/guillermomolina/housewire/issues"
Changelog = "https://github.com/guillermomolina/housewire-catalog/blob/main/CHANGELOG.md"

[project.entry-points."housewire.catalog"]
default = "housewire_catalog:catalog_root"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
housewire_catalog = [
    "catalog.yaml",
    "logo.svg",
    "types/*.yaml",
    "types/*.yml",
    "types/symbols/*.svg",
]
